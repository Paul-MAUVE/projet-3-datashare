services:
  postgres:
    image: postgres:18.6
    container_name: datashare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: datashare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
